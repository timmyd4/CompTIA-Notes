<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A+ Core 1 Practice</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#e6e8ec; --muted:#9aa1ad; --accent:#4f8cff; --ok:#2fbf71; --bad:#e5484d; --line:#2a2f3a; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .muted { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-top:16px; }
  label.sub { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin:6px 0; cursor:pointer; }
  label.sub input { margin-right:10px; }
  button { font:inherit; border:0; border-radius:8px; padding:10px 18px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button:disabled { opacity:.5; cursor:default; }
  select, input[type=number] { font:inherit; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .choice { display:block; width:100%; text-align:left; background:var(--bg); color:var(--text); border:1px solid var(--line); margin:8px 0; padding:12px 14px; }
  .choice:hover:not(:disabled) { border-color:var(--accent); }
  .choice.correct { border-color:var(--ok); background:rgba(47,191,113,.15); }
  .choice.wrong { border-color:var(--bad); background:rgba(229,72,77,.15); }
  .choice:disabled { opacity:1; cursor:default; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:8px; }
  .bar > div { height:100%; background:var(--accent); }
  .tag { font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .explain { margin-top:12px; padding:12px; border-left:3px solid var(--accent); background:var(--bg); border-radius:4px; }
  .miss { padding:10px 0; border-top:1px solid var(--line); }
  .big { font-size:2.4rem; font-weight:700; }
  kbd { border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:.8rem; }
</style>
</head>
<body>
<main id="app"></main>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
